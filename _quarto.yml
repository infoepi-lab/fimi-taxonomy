project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!blog/index.qmd"
  resources:
    - "labeler.html"
    - "login.html"
    - "auth-debug.html"
    - "*.png"
    - "*.svg"
    - "*.js"
    - "*.css"

title: "FIMI Taxonomy"
date: 2026-02-24
author:
  name:
    given: E. Rosalie
    family: Li
  url: https://infoepi.org
  affiliation: Information Epidemiology Lab

citation:
  type: article-journal

website:
  site-url: "https://fimi.infoepi.org"
  open-graph: true
  twitter-card: true
  reader-mode: true
  search:
    location: navbar
    type: overlay
  body-footer: |
    FIMI Taxonomy by [Information Epidemiology Lab](https://infoepi.org).
  favicon: favicon.png
  announcement:
    content: "**FIMI Taxonomy v4.1** — Modular taxonomy of foreign information manipulation and interference"
    icon: info-circle
    position: below-navbar
    dismissable: true
    type: primary
  navbar:
    background: dark
    logo: logo.svg
    logo-alt: "FIMI Taxonomy"
    search: true
    left:
      - file: index.qmd
        text: "Home"
      - file: function/index.qmd
        text: "Functions"
      - file: mechanisms/index.qmd
        text: "Mechanisms"
      - file: terrain/index.qmd
        text: "Terrain"
      - file: channel_types/index.qmd
        text: "Channels"
    right:
      - file: notes.qmd
        text: "Notes"
      - href: labeler.html
        text: "Data Labeler"
      - href: login.html
        text: "Sign In"
  page-footer:
    left: "FIMI Taxonomy"
    right:
      - file: function/index.qmd
        text: "Functions"
      - file: mechanisms/index.qmd
        text: "Mechanisms"
      - file: terrain/index.qmd
        text: "Terrain"
      - file: channel_types/index.qmd
        text: "Channels"
      - file: notes.qmd
        text: "Notes"

format:
  html:
    theme:
      light: [paper, brand]
      dark: darkly
    css: 
      - styles.css
      - auth-styles.css
    toc: true
    toc-location: right
    lang: en
    page-layout: full
    grid:
      sidebar-width: 280px
      body-width: 900px
      margin-width: 260px
      gutter-width: 1.5rem
    include-in-header:
      text: |
        <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    include-after-body:
      text: |
        <script src="auth0-config.js"></script>
        <script>
          // Update navbar "Sign In" link based on auth status
          document.addEventListener('DOMContentLoaded', async function() {
            if (typeof auth0Client !== 'undefined' && auth0Client) {
              const isAuthenticated = await auth0Client.isAuthenticated();
              const signInLink = document.querySelector('a[href="login.html"]');
              
              if (signInLink && isAuthenticated) {
                const user = await auth0Client.getUser();
                signInLink.textContent = user.name || user.email || 'Account';
                signInLink.href = '#';
                signInLink.onclick = async (e) => {
                  e.preventDefault();
                  if (confirm('Sign out?')) {
                    await logout();
                  }
                };
              }
            }
          });
        </script>

execute:
  freeze: auto

editor: visual
